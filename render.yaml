# Render Blueprint for Map2Drone — backend (FastAPI) + Postgres.
# The frontend (Vite) is deployed separately on Vercel and points here via
# VITE_API_BASE (see frontend/.env.example).

services:
  - type: web
    name: map2drone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: map2drone-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://map2drone-frontend.vercel.app","https://map2drone.vercel.app"]'

databases:
  - name: map2drone-db
    plan: free
    databaseName: map2drone
    user: map2drone